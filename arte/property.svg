<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 290" width="670" height="290" role="group" aria-labelledby="property-title property-desc"><title id="property-title">Tener un título, poder decidir</title><desc id="property-desc">La propiedad se examina a través de facultades concretas. Título jurídico: facultades reconocidas, hacia Decisión efectiva. Decisión efectiva: consecuencias, hacia Responsabilidad. Decisión efectiva: alternativas disponibles, hacia Salida y recurso.</desc><style>text{font-family:Arial,sans-serif;fill:#171717}.node-rect{fill:#fff;stroke:#ccc}.node-label{font-size:13px}.node-dot{fill:#24735b}.edge{stroke:#666;fill:none}.edge-label{font-size:10px;fill:#555;paint-order:stroke;stroke:#fafafa;stroke-width:4px;stroke-linejoin:round}</style><rect width="670" height="290" fill="#fafafa"/><defs><marker id="property-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#666"/></marker></defs><path class="edge" d="M 198 65 L 248 65" stroke-width="1" marker-end="url(#property-arrow)"/><text class="edge-label" x="223" y="25" text-anchor="middle">facultades reconocidas</text><path class="edge" d="M 418 65 L 468 65" stroke-width="1" marker-end="url(#property-arrow)"/><text class="edge-label" x="443" y="25" text-anchor="middle">consecuencias</text><path class="edge" d="M 335 93 L 335 203" stroke-width="1" marker-end="url(#property-arrow)"/><text class="edge-label" x="335" y="139" text-anchor="middle">alternativas disponibles</text><g data-node="title" data-description="Identifica la titularidad. Por sí solo no informa cuánto puede decidir una persona o qué amenazas enfrenta." data-label="Título jurídico" aria-label="Título jurídico"><rect class="node-rect" x="30" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="47" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="123" y="69">Título jurídico</tspan></text></g><g data-node="decide" data-description="Invertir, contratar, producir y vender requieren márgenes reales de elección que deben comprobarse." data-label="Decisión efectiva" aria-label="Decisión efectiva"><rect class="node-rect" x="250" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="69">Decisión efectiva</tspan></text></g><g data-node="risk" data-description="Los resultados y las pérdidas influyen en las decisiones. Rescates selectivos pueden separar la ventaja de su costo." data-label="Responsabilidad" aria-label="Responsabilidad"><rect class="node-rect" x="470" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="487" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="563" y="69">Responsabilidad</tspan></text></g><g data-node="exit" data-description="Poder abandonar una relación, transferir una actividad o recurrir una orden ayuda a distinguir propiedad de subordinación." data-label="Salida y recurso" aria-label="Salida y recurso"><rect class="node-rect" x="250" y="208" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="235" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="239">Salida y recurso</tspan></text></g></svg>