<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 290" width="670" height="290" role="group" aria-labelledby="comparison-title comparison-desc"><title id="comparison-title">Comparar sin borrar las diferencias</title><desc id="comparison-desc">Una analogía útil muestra lo que coincide y lo que no permite concluir. Hecho observado: explicación contrastable, hacia Mecanismo. Mecanismo: pregunta comparativa, hacia Comparación histórica. Límite y objeción: control de alcance, hacia Comparación histórica.</desc><style>text{font-family:Arial,sans-serif;fill:#171717}.node-rect{fill:#fff;stroke:#ccc}.node-label{font-size:13px}.node-dot{fill:#24735b}.edge{stroke:#666;fill:none}.edge-label{font-size:10px;fill:#555;paint-order:stroke;stroke:#fafafa;stroke-width:4px;stroke-linejoin:round}</style><rect width="670" height="290" fill="#fafafa"/><defs><marker id="comparison-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#666"/></marker></defs><path class="edge" d="M 198 65 L 248 65" stroke-width="1" marker-end="url(#comparison-arrow)"/><text class="edge-label" x="223" y="25" text-anchor="middle">explicación contrastable</text><path class="edge" d="M 418 65 L 468 65" stroke-width="1" marker-end="url(#comparison-arrow)"/><text class="edge-label" x="443" y="25" text-anchor="middle">pregunta comparativa</text><path class="edge" d="M 418 235 L 468 65" stroke-width="1" marker-end="url(#comparison-arrow)"/><text class="edge-label" x="443" y="141" text-anchor="middle">control de alcance</text><g data-node="fact" data-description="Describir una acción verificable con fecha, responsables, ámbito y evidencia." data-label="Hecho observado" aria-label="Hecho observado"><rect class="node-rect" x="30" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="47" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="123" y="69">Hecho observado</tspan></text></g><g data-node="mechanism" data-description="Proponer cómo la acción modifica incentivos, derechos o capacidad de decisión." data-label="Mecanismo" aria-label="Mecanismo"><rect class="node-rect" x="250" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="69">Mecanismo</tspan></text></g><g data-node="comparison" data-description="Examinar semejanzas y diferencias con un caso histórico concreto, sin convertirlas en equivalencia automática." data-label="Comparación histórica" aria-label="Comparación histórica"><rect class="node-rect" x="470" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="487" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="563" y="61.5">Comparación</tspan><tspan x="563" y="76.5">histórica</tspan></text></g><g data-node="limit" data-description="Indicar qué datos contradicen la comparación y qué conclusión no puede sostenerse." data-label="Límite y objeción" aria-label="Límite y objeción"><rect class="node-rect" x="250" y="208" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="235" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="239">Límite y objeción</tspan></text></g></svg>