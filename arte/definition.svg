<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 290" width="670" height="290" role="group" aria-labelledby="definition-title definition-desc"><title id="definition-title">Un concepto con límites</title><desc id="definition-desc">Los mecanismos económicos forman parte de un proyecto político más amplio. Nación homogénea: pretensión de representar, hacia Liderazgo sin límites. Liderazgo sin límites: organización y amparo, hacia Violencia política. Violencia política: supresión, hacia Destrucción pluralista. Nación homogénea: exclusión, hacia Destrucción pluralista.</desc><style>text{font-family:Arial,sans-serif;fill:#171717}.node-rect{fill:#fff;stroke:#ccc}.node-label{font-size:13px}.node-dot{fill:#24735b}.edge{stroke:#666;fill:none}.edge-label{font-size:10px;fill:#555;paint-order:stroke;stroke:#fafafa;stroke-width:4px;stroke-linejoin:round}</style><rect width="670" height="290" fill="#fafafa"/><defs><marker id="definition-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#666"/></marker></defs><path class="edge" d="M 198 65 L 248 65" stroke-width="1" marker-end="url(#definition-arrow)"/><text class="edge-label" x="223" y="25" text-anchor="middle">pretensión de representar</text><path class="edge" d="M 418 65 L 468 65" stroke-width="1" marker-end="url(#definition-arrow)"/><text class="edge-label" x="443" y="25" text-anchor="middle">organización y amparo</text><path class="edge" d="M 472 65 L 422 235" stroke-width="1" marker-end="url(#definition-arrow)"/><text class="edge-label" x="447" y="141" text-anchor="middle">supresión</text><path class="edge" d="M 198 65 L 248 235" stroke-width="1" marker-end="url(#definition-arrow)"/><text class="edge-label" x="223" y="141" text-anchor="middle">exclusión</text><g data-node="nation" data-description="Una comunidad nacional presentada como un cuerpo único, con diferencias que deben someterse a un fin obligatorio." data-label="Nación homogénea" aria-label="Nación homogénea"><rect class="node-rect" x="30" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="47" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="123" y="69">Nación homogénea</tspan></text></g><g data-node="leader" data-description="La pretensión de encarnar al conjunto permite tratar el control del poder como una traición a la comunidad." data-label="Liderazgo sin límites" aria-label="Liderazgo sin límites"><rect class="node-rect" x="250" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="61.5">Liderazgo sin</tspan><tspan x="343" y="76.5">límites</tspan></text></g><g data-node="force" data-description="La fuerza organizada contra opositores y grupos perseguidos tiene un lugar constitutivo en la historia fascista." data-label="Violencia política" aria-label="Violencia política"><rect class="node-rect" x="470" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="487" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="563" y="69">Violencia política</tspan></text></g><g data-node="plural" data-description="Se elimina la capacidad de organizar alternativas políticas, culturales y económicas independientes." data-label="Destrucción pluralista" aria-label="Destrucción pluralista"><rect class="node-rect" x="250" y="208" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="235" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="231.5">Destrucción</tspan><tspan x="343" y="246.5">pluralista</tspan></text></g></svg>