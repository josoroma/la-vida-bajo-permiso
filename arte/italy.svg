<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 290" width="670" height="290" role="group" aria-labelledby="italy-title italy-desc"><title id="italy-title">Italia: fases que no deben confundirse</title><desc id="italy-desc">La toma del gobierno, la dictadura y la persecución se desarrollaron en etapas. 1922 · Gobierno: consolidación, hacia 1925–26 · Dictadura. 1925–26 · Dictadura: radicalización, hacia 1938 · Leyes raciales. 1938 · Leyes raciales: guerra y ocupación, hacia 1943 · Nueva etapa.</desc><style>text{font-family:Arial,sans-serif;fill:#171717}.node-rect{fill:#fff;stroke:#ccc}.node-label{font-size:13px}.node-dot{fill:#24735b}.edge{stroke:#666;fill:none}.edge-label{font-size:10px;fill:#555;paint-order:stroke;stroke:#fafafa;stroke-width:4px;stroke-linejoin:round}</style><rect width="670" height="290" fill="#fafafa"/><defs><marker id="italy-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#666"/></marker></defs><path class="edge" d="M 198 65 L 248 65" stroke-width="1" marker-end="url(#italy-arrow)"/><text class="edge-label" x="223" y="25" text-anchor="middle">consolidación</text><path class="edge" d="M 418 65 L 468 65" stroke-width="1" marker-end="url(#italy-arrow)"/><text class="edge-label" x="443" y="25" text-anchor="middle">radicalización</text><path class="edge" d="M 555 93 L 555 203" stroke-width="1" marker-end="url(#italy-arrow)"/><text class="edge-label" x="555" y="139" text-anchor="middle">guerra y ocupación</text><g data-node="1922" data-description="La llegada al gobierno tras la Marcha sobre Roma abrió el proceso de consolidación. No equivale a que todo el sistema estuviera ya transformado." data-label="1922 · Gobierno" aria-label="1922 · Gobierno"><rect class="node-rect" x="30" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="47" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="123" y="69">1922 · Gobierno</tspan></text></g><g data-node="1926" data-description="La supresión de oposición y organizaciones independientes cerró espacios de competencia política." data-label="1925–26 · Dictadura" aria-label="1925–26 · Dictadura"><rect class="node-rect" x="250" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="61.5">1925–26 ·</tspan><tspan x="343" y="76.5">Dictadura</tspan></text></g><g data-node="1938" data-description="Las disposiciones antijudías convirtieron la exclusión en política jurídica explícita. No borran la violencia colonial anterior." data-label="1938 · Leyes raciales" aria-label="1938 · Leyes raciales"><rect class="node-rect" x="470" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="487" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="563" y="61.5">1938 · Leyes</tspan><tspan x="563" y="76.5">raciales</tspan></text></g><g data-node="1943" data-description="La caída del gobierno de Mussolini y la ocupación alemana abrieron una fase distinta, con la República Social Italiana y deportaciones." data-label="1943 · Nueva etapa" aria-label="1943 · Nueva etapa"><rect class="node-rect" x="470" y="208" width="170" height="54" rx="4"/><circle class="node-dot" cx="487" cy="235" r="3"/><text class="node-label" text-anchor="middle"><tspan x="563" y="239">1943 · Nueva etapa</tspan></text></g></svg>