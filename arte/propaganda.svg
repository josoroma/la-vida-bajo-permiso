<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 290" width="670" height="290" role="group" aria-labelledby="propaganda-title propaganda-desc"><title id="propaganda-title">De la diferencia a la amenaza</title><desc id="propaganda-desc">Nombrar a un enemigo cambia qué actos se presentan como aceptables. Relato de amenaza: difusión, hacia Repetición y canales. Repetición y canales: posible normalización, hacia Permiso social. Permiso social: justificación, hacia Prácticas de exclusión.</desc><style>text{font-family:Arial,sans-serif;fill:#171717}.node-rect{fill:#fff;stroke:#ccc}.node-label{font-size:13px}.node-dot{fill:#24735b}.edge{stroke:#666;fill:none}.edge-label{font-size:10px;fill:#555;paint-order:stroke;stroke:#fafafa;stroke-width:4px;stroke-linejoin:round}</style><rect width="670" height="290" fill="#fafafa"/><defs><marker id="propaganda-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#666"/></marker></defs><path class="edge" d="M 198 65 L 248 65" stroke-width="1" marker-end="url(#propaganda-arrow)"/><text class="edge-label" x="223" y="25" text-anchor="middle">difusión</text><path class="edge" d="M 418 65 L 468 65" stroke-width="1" marker-end="url(#propaganda-arrow)"/><text class="edge-label" x="443" y="25" text-anchor="middle">posible normalización</text><path class="edge" d="M 555 93 L 555 203" stroke-width="1" marker-end="url(#propaganda-arrow)"/><text class="edge-label" x="555" y="139" text-anchor="middle">justificación</text><g data-node="message" data-description="Una diferencia social se representa como peligro para la supervivencia del conjunto." data-label="Relato de amenaza" aria-label="Relato de amenaza"><rect class="node-rect" x="30" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="47" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="123" y="69">Relato de amenaza</tspan></text></g><g data-node="channel" data-description="La difusión depende de medios, financiación y accesos. Recibir un mensaje no prueba creerlo." data-label="Repetición y canales" aria-label="Repetición y canales"><rect class="node-rect" x="250" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="61.5">Repetición y</tspan><tspan x="343" y="76.5">canales</tspan></text></g><g data-node="norm" data-description="La exclusión se normaliza cuando se considera legítimo negar a otros derechos que se reclaman para uno mismo." data-label="Permiso social" aria-label="Permiso social"><rect class="node-rect" x="470" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="487" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="563" y="69">Permiso social</tspan></text></g><g data-node="action" data-description="Despido, censura, despojo o violencia tienen responsables y mecanismos concretos que deben documentarse." data-label="Prácticas de exclusión" aria-label="Prácticas de exclusión"><rect class="node-rect" x="470" y="208" width="170" height="54" rx="4"/><circle class="node-dot" cx="487" cy="235" r="3"/><text class="node-label" text-anchor="middle"><tspan x="563" y="231.5">Prácticas de</tspan><tspan x="563" y="246.5">exclusión</tspan></text></g></svg>