<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 290" width="670" height="290" role="group" aria-labelledby="war-title war-desc"><title id="war-title">Producir para la movilización</title><desc id="war-desc">La organización de la guerra afecta recursos, trabajo y capacidad de decidir. Objetivo militar: prioridades, hacia Asignación productiva. Asignación productiva: demanda de trabajo, hacia Trabajo y coerción. Recursos y despojo: suministro coercitivo, hacia Asignación productiva. Objetivo militar: expansión, hacia Recursos y despojo.</desc><style>text{font-family:Arial,sans-serif;fill:#171717}.node-rect{fill:#fff;stroke:#ccc}.node-label{font-size:13px}.node-dot{fill:#24735b}.edge{stroke:#666;fill:none}.edge-label{font-size:10px;fill:#555;paint-order:stroke;stroke:#fafafa;stroke-width:4px;stroke-linejoin:round}</style><rect width="670" height="290" fill="#fafafa"/><defs><marker id="war-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#666"/></marker></defs><path class="edge" d="M 198 65 L 248 65" stroke-width="1" marker-end="url(#war-arrow)"/><text class="edge-label" x="223" y="25" text-anchor="middle">prioridades</text><path class="edge" d="M 418 65 L 468 65" stroke-width="1" marker-end="url(#war-arrow)"/><text class="edge-label" x="443" y="25" text-anchor="middle">demanda de trabajo</text><path class="edge" d="M 335 207 L 335 97" stroke-width="1" marker-end="url(#war-arrow)"/><text class="edge-label" x="335" y="143" text-anchor="middle">suministro coercitivo</text><path class="edge" d="M 198 65 L 248 235" stroke-width="1" marker-end="url(#war-arrow)"/><text class="edge-label" x="223" y="141" text-anchor="middle">expansión</text><g data-node="goal" data-description="Las decisiones políticas sobre expansión y guerra orientan prioridades productivas." data-label="Objetivo militar" aria-label="Objetivo militar"><rect class="node-rect" x="30" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="47" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="123" y="69">Objetivo militar</tspan></text></g><g data-node="production" data-description="Contratos, restricciones y acceso a insumos modifican incentivos y capacidad empresarial." data-label="Asignación productiva" aria-label="Asignación productiva"><rect class="node-rect" x="250" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="61.5">Asignación</tspan><tspan x="343" y="76.5">productiva</tspan></text></g><g data-node="labor" data-description="La movilización incluye formas distintas de trabajo; el trabajo forzado debe identificarse como violencia contra personas." data-label="Trabajo y coerción" aria-label="Trabajo y coerción"><rect class="node-rect" x="470" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="487" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="563" y="69">Trabajo y coerción</tspan></text></g><g data-node="resources" data-description="La conquista y la persecución pueden convertir despojo y explotación en fuentes de recursos para el régimen." data-label="Recursos y despojo" aria-label="Recursos y despojo"><rect class="node-rect" x="250" y="208" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="235" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="239">Recursos y despojo</tspan></text></g></svg>