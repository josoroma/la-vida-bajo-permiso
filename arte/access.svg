<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 290" width="670" height="290" role="group" aria-labelledby="access-title access-desc"><title id="access-title">Las puertas de una actividad</title><desc id="access-desc">La libertad de emprender depende también de alternativas practicables. Actividad propia: necesidad de servicio, hacia Infraestructura. Infraestructura: condiciones, hacia Reglas de acceso. Alternativas y salida: capacidad de elegir, hacia Actividad propia. Reglas de acceso: costo de cambiar, hacia Alternativas y salida.</desc><style>text{font-family:Arial,sans-serif;fill:#171717}.node-rect{fill:#fff;stroke:#ccc}.node-label{font-size:13px}.node-dot{fill:#24735b}.edge{stroke:#666;fill:none}.edge-label{font-size:10px;fill:#555;paint-order:stroke;stroke:#fafafa;stroke-width:4px;stroke-linejoin:round}</style><rect width="670" height="290" fill="#fafafa"/><defs><marker id="access-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#666"/></marker></defs><path class="edge" d="M 198 65 L 248 65" stroke-width="1" marker-end="url(#access-arrow)"/><text class="edge-label" x="223" y="25" text-anchor="middle">necesidad de servicio</text><path class="edge" d="M 418 65 L 468 65" stroke-width="1" marker-end="url(#access-arrow)"/><text class="edge-label" x="443" y="25" text-anchor="middle">condiciones</text><path class="edge" d="M 252 235 L 202 65" stroke-width="1" marker-end="url(#access-arrow)"/><text class="edge-label" x="227" y="141" text-anchor="middle">capacidad de elegir</text><path class="edge" d="M 472 65 L 422 235" stroke-width="1" marker-end="url(#access-arrow)"/><text class="edge-label" x="447" y="141" text-anchor="middle">costo de cambiar</text><g data-node="enterprise" data-description="Una iniciativa necesita clientes, insumos, trabajo y capacidad de organizar sus planes." data-label="Actividad propia" aria-label="Actividad propia"><rect class="node-rect" x="30" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="47" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="123" y="69">Actividad propia</tspan></text></g><g data-node="platform" data-description="Pagos, alojamiento, distribución o mercados digitales pueden convertirse en dependencias difíciles de sustituir." data-label="Infraestructura" aria-label="Infraestructura"><rect class="node-rect" x="250" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="69">Infraestructura</tspan></text></g><g data-node="entry" data-description="Las condiciones pueden ser generales o discriminatorias; una restricción requiere analizar contrato, poder y contexto." data-label="Reglas de acceso" aria-label="Reglas de acceso"><rect class="node-rect" x="470" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="487" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="563" y="69">Reglas de acceso</tspan></text></g><g data-node="alternatives" data-description="Portabilidad, interoperabilidad, entrada y recursos pueden reducir dependencia, aunque tienen costos y límites." data-label="Alternativas y salida" aria-label="Alternativas y salida"><rect class="node-rect" x="250" y="208" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="235" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="231.5">Alternativas y</tspan><tspan x="343" y="246.5">salida</tspan></text></g></svg>