<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 290" width="670" height="290" role="group" aria-labelledby="privilege-title privilege-desc"><title id="privilege-title">El circuito del privilegio</title><desc id="privilege-desc">La protección política puede volver rentable impedir que otros compitan. Interés organizado: solicitud y presión, hacia Decisión pública. Decisión pública: regla selectiva, hacia Ventaja reservada. Ventaja reservada: beneficio concentrado, hacia Recursos e influencia. Recursos e influencia: capacidad de sostenerse, hacia Interés organizado.</desc><style>text{font-family:Arial,sans-serif;fill:#171717}.node-rect{fill:#fff;stroke:#ccc}.node-label{font-size:13px}.node-dot{fill:#24735b}.edge{stroke:#666;fill:none}.edge-label{font-size:10px;fill:#555;paint-order:stroke;stroke:#fafafa;stroke-width:4px;stroke-linejoin:round}</style><rect width="670" height="290" fill="#fafafa"/><defs><marker id="privilege-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#666"/></marker></defs><path class="edge" d="M 198 65 L 248 65" stroke-width="1" marker-end="url(#privilege-arrow)"/><text class="edge-label" x="223" y="25" text-anchor="middle">solicitud y presión</text><path class="edge" d="M 418 65 L 468 65" stroke-width="1" marker-end="url(#privilege-arrow)"/><text class="edge-label" x="443" y="25" text-anchor="middle">regla selectiva</text><path class="edge" d="M 472 65 L 422 235" stroke-width="1" marker-end="url(#privilege-arrow)"/><text class="edge-label" x="447" y="141" text-anchor="middle">beneficio concentrado</text><path class="edge" d="M 252 235 L 202 65" stroke-width="1" marker-end="url(#privilege-arrow)"/><text class="edge-label" x="227" y="141" text-anchor="middle">capacidad de sostenerse</text><g data-node="group" data-description="Empresas, sindicatos o asociaciones pueden solicitar ventajas. El análisis debe identificar una regla concreta, no atribuir culpa por pertenencia." data-label="Interés organizado" aria-label="Interés organizado"><rect class="node-rect" x="30" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="47" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="123" y="69">Interés organizado</tspan></text></g><g data-node="state" data-description="Una autoridad dispone de instrumentos que afectan entrada, acceso a recursos o trato jurídico." data-label="Decisión pública" aria-label="Decisión pública"><rect class="node-rect" x="250" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="69">Decisión pública</tspan></text></g><g data-node="benefit" data-description="Una exclusividad o barrera protege ingresos y desplaza parte del costo a otros." data-label="Ventaja reservada" aria-label="Ventaja reservada"><rect class="node-rect" x="470" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="487" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="563" y="69">Ventaja reservada</tspan></text></g><g data-node="support" data-description="Una posición protegida puede aportar recursos para defender su continuidad. El vínculo requiere evidencia, no presunción." data-label="Recursos e influencia" aria-label="Recursos e influencia"><rect class="node-rect" x="250" y="208" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="235" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="231.5">Recursos e</tspan><tspan x="343" y="246.5">influencia</tspan></text></g></svg>