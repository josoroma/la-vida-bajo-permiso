<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 290" width="670" height="290" role="group" aria-labelledby="emergency-title emergency-desc"><title id="emergency-title">Una excepción necesita una salida</title><desc id="emergency-desc">El control de una emergencia se examina también cuando el peligro disminuye. Hecho excepcional: justificación, hacia Poder temporal. Poder temporal: control, hacia Revisión efectiva. Revisión efectiva: decisión motivada, hacia Caducidad o renovación. Caducidad o renovación: si se renueva, hacia Poder temporal.</desc><style>text{font-family:Arial,sans-serif;fill:#171717}.node-rect{fill:#fff;stroke:#ccc}.node-label{font-size:13px}.node-dot{fill:#24735b}.edge{stroke:#666;fill:none}.edge-label{font-size:10px;fill:#555;paint-order:stroke;stroke:#fafafa;stroke-width:4px;stroke-linejoin:round}</style><rect width="670" height="290" fill="#fafafa"/><defs><marker id="emergency-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#666"/></marker></defs><path class="edge" d="M 198 65 L 248 65" stroke-width="1" marker-end="url(#emergency-arrow)"/><text class="edge-label" x="223" y="25" text-anchor="middle">justificación</text><path class="edge" d="M 418 65 L 468 65" stroke-width="1" marker-end="url(#emergency-arrow)"/><text class="edge-label" x="443" y="25" text-anchor="middle">control</text><path class="edge" d="M 472 65 L 422 235" stroke-width="1" marker-end="url(#emergency-arrow)"/><text class="edge-label" x="447" y="141" text-anchor="middle">decisión motivada</text><path class="edge" d="M 335 207 L 335 97" stroke-width="1" marker-end="url(#emergency-arrow)"/><text class="edge-label" x="335" y="143" text-anchor="middle">si se renueva</text><g data-node="cause" data-description="Identificar el peligro real, su alcance y la evidencia disponible; evitar que una etiqueta sustituya la justificación." data-label="Hecho excepcional" aria-label="Hecho excepcional"><rect class="node-rect" x="30" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="47" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="123" y="69">Hecho excepcional</tspan></text></g><g data-node="power" data-description="Delimitar facultades, responsables, plazo y medidas aplicables." data-label="Poder temporal" aria-label="Poder temporal"><rect class="node-rect" x="250" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="69">Poder temporal</tspan></text></g><g data-node="review" data-description="Examinar necesidad, resultados, afectados y alternativas, con órganos capaces de contradecir al Ejecutivo." data-label="Revisión efectiva" aria-label="Revisión efectiva"><rect class="node-rect" x="470" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="487" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="563" y="69">Revisión efectiva</tspan></text></g><g data-node="end" data-description="La finalización debe ser posible. Una renovación requiere razones nuevas y comprobables, no inercia administrativa." data-label="Caducidad o renovación" aria-label="Caducidad o renovación"><rect class="node-rect" x="250" y="208" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="235" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="231.5">Caducidad o</tspan><tspan x="343" y="246.5">renovación</tspan></text></g></svg>