<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 290" width="670" height="290" role="group" aria-labelledby="intervention-title intervention-desc"><title id="intervention-title">Una decisión tiene más de una salida</title><desc id="intervention-desc">Un efecto adverso no convierte la ampliación del control en un destino inevitable. Medida inicial: evaluación, hacia Resultados. Resultados: una respuesta posible, hacia Ampliar controles. Resultados: otra respuesta posible, hacia Corregir o retirar.</desc><style>text{font-family:Arial,sans-serif;fill:#171717}.node-rect{fill:#fff;stroke:#ccc}.node-label{font-size:13px}.node-dot{fill:#24735b}.edge{stroke:#666;fill:none}.edge-label{font-size:10px;fill:#555;paint-order:stroke;stroke:#fafafa;stroke-width:4px;stroke-linejoin:round}</style><rect width="670" height="290" fill="#fafafa"/><defs><marker id="intervention-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#666"/></marker></defs><path class="edge" d="M 198 65 L 248 65" stroke-width="1" marker-end="url(#intervention-arrow)"/><text class="edge-label" x="223" y="25" text-anchor="middle">evaluación</text><path class="edge" d="M 418 65 L 468 65" stroke-width="1" marker-end="url(#intervention-arrow)"/><text class="edge-label" x="443" y="25" text-anchor="middle">una respuesta posible</text><path class="edge" d="M 335 93 L 335 203" stroke-width="1" marker-end="url(#intervention-arrow)"/><text class="edge-label" x="335" y="139" text-anchor="middle">otra respuesta posible</text><g data-node="measure" data-description="Definir objetivo, instrumento y condiciones. Una intención no basta para evaluar sus resultados." data-label="Medida inicial" aria-label="Medida inicial"><rect class="node-rect" x="30" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="47" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="123" y="69">Medida inicial</tspan></text></g><g data-node="result" data-description="Examinar efectos buscados, costos, desplazamientos y evidencia contraria a la explicación preferida." data-label="Resultados" aria-label="Resultados"><rect class="node-rect" x="250" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="69">Resultados</tspan></text></g><g data-node="expand" data-description="Una respuesta posible consiste en cerrar las vías de evasión o extender el ámbito de la medida." data-label="Ampliar controles" aria-label="Ampliar controles"><rect class="node-rect" x="470" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="487" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="563" y="69">Ampliar controles</tspan></text></g><g data-node="correct" data-description="También existen revisión, caducidad, sustitución del instrumento y restitución de alternativas." data-label="Corregir o retirar" aria-label="Corregir o retirar"><rect class="node-rect" x="250" y="208" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="235" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="239">Corregir o retirar</tspan></text></g></svg>