<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 290" width="670" height="290" role="group" aria-labelledby="prologue-title prologue-desc"><title id="prologue-title">Quién obtiene la excepción</title><desc id="prologue-desc">Un beneficio reservado también tiene un costo fuera de la mesa de negociación. Regla común: modificación solicitada, hacia Acceso político. Acceso político: decisión favorable, hacia Excepción. Excepción: costo o exclusión, hacia Quienes quedan fuera.</desc><style>text{font-family:Arial,sans-serif;fill:#171717}.node-rect{fill:#fff;stroke:#ccc}.node-label{font-size:13px}.node-dot{fill:#24735b}.edge{stroke:#666;fill:none}.edge-label{font-size:10px;fill:#555;paint-order:stroke;stroke:#fafafa;stroke-width:4px;stroke-linejoin:round}</style><rect width="670" height="290" fill="#fafafa"/><defs><marker id="prologue-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#666"/></marker></defs><path class="edge" d="M 198 65 L 248 65" stroke-width="1" marker-end="url(#prologue-arrow)"/><text class="edge-label" x="223" y="25" text-anchor="middle">modificación solicitada</text><path class="edge" d="M 418 65 L 468 65" stroke-width="1" marker-end="url(#prologue-arrow)"/><text class="edge-label" x="443" y="25" text-anchor="middle">decisión favorable</text><path class="edge" d="M 472 65 L 422 235" stroke-width="1" marker-end="url(#prologue-arrow)"/><text class="edge-label" x="447" y="141" text-anchor="middle">costo o exclusión</text><g data-node="rule" data-description="Una norma general permite anticipar las condiciones y reclamar el mismo trato en situaciones comparables." data-label="Regla común" aria-label="Regla común"><rect class="node-rect" x="30" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="47" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="123" y="69">Regla común</tspan></text></g><g data-node="access" data-description="Los grupos organizados pueden intentar modificar la regla en su favor. La cercanía por sí sola no demuestra una ventaja ilícita." data-label="Acceso político" aria-label="Acceso político"><rect class="node-rect" x="250" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="69">Acceso político</tspan></text></g><g data-node="exception" data-description="La ventaja debe identificarse: exclusividad, barrera, subsidio selectivo o dispensa. No basta con señalar que existe una asociación." data-label="Excepción" aria-label="Excepción"><rect class="node-rect" x="470" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="487" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="563" y="69">Excepción</tspan></text></g><g data-node="excluded" data-description="Consumidores, nuevos competidores o trabajadores no representados pueden soportar parte del costo sin haber participado en la decisión." data-label="Quienes quedan fuera" aria-label="Quienes quedan fuera"><rect class="node-rect" x="250" y="208" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="235" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="231.5">Quienes quedan</tspan><tspan x="343" y="246.5">fuera</tspan></text></g></svg>