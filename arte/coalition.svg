<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 290" width="670" height="290" role="group" aria-labelledby="coalition-title coalition-desc"><title id="coalition-title">Nadie ocupa el poder a solas</title><desc id="coalition-desc">Los apoyos de una coalición pueden tener motivos distintos y consecuencias compartidas. Élites y financiadores: apoyo y negociación, hacia Organización política. Instituciones: apertura o límite, hacia Organización política. Organización política: movilización, hacia Adhesión y resistencia. Adhesión y resistencia: presión o defensa, hacia Instituciones.</desc><style>text{font-family:Arial,sans-serif;fill:#171717}.node-rect{fill:#fff;stroke:#ccc}.node-label{font-size:13px}.node-dot{fill:#24735b}.edge{stroke:#666;fill:none}.edge-label{font-size:10px;fill:#555;paint-order:stroke;stroke:#fafafa;stroke-width:4px;stroke-linejoin:round}</style><rect width="670" height="290" fill="#fafafa"/><defs><marker id="coalition-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#666"/></marker></defs><path class="edge" d="M 252 65 L 202 65" stroke-width="1" marker-end="url(#coalition-arrow)"/><text class="edge-label" x="227" y="25" text-anchor="middle">apoyo y negociación</text><path class="edge" d="M 555 93 V 132 H 115 V 97" stroke-width="1" marker-end="url(#coalition-arrow)"/><text class="edge-label" x="337" y="124" text-anchor="middle">apertura o límite</text><path class="edge" d="M 198 65 L 248 235" stroke-width="1" marker-end="url(#coalition-arrow)"/><text class="edge-label" x="223" y="141" text-anchor="middle">movilización</text><path class="edge" d="M 418 235 L 468 65" stroke-width="1" marker-end="url(#coalition-arrow)"/><text class="edge-label" x="443" y="141" text-anchor="middle">presión o defensa</text><g data-node="party" data-description="Organiza militantes, propaganda y objetivos de conquista del poder. Sus proyectos no se reducen a los intereses de sus aliados." data-label="Organización política" aria-label="Organización política"><rect class="node-rect" x="30" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="47" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="123" y="61.5">Organización</tspan><tspan x="123" y="76.5">política</tspan></text></g><g data-node="elites" data-description="Pueden buscar protección, influencia o contención de adversarios. La colaboración y el margen de decisión deben investigarse por caso." data-label="Élites y financiadores" aria-label="Élites y financiadores"><rect class="node-rect" x="250" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="61.5">Élites y</tspan><tspan x="343" y="76.5">financiadores</tspan></text></g><g data-node="institutions" data-description="Nombramientos, decisiones judiciales y tolerancia policial pueden facilitar o impedir una escalada." data-label="Instituciones" aria-label="Instituciones"><rect class="node-rect" x="470" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="487" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="563" y="69">Instituciones</tspan></text></g><g data-node="people" data-description="La sociedad incluye apoyos, oposiciones, adaptación, indiferencia y personas que ya están siendo excluidas." data-label="Adhesión y resistencia" aria-label="Adhesión y resistencia"><rect class="node-rect" x="250" y="208" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="235" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="231.5">Adhesión y</tspan><tspan x="343" y="246.5">resistencia</tspan></text></g></svg>