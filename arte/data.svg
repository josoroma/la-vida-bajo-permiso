<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 290" width="670" height="290" role="group" aria-labelledby="data-title data-desc"><title id="data-title">Quién puede observar, decidir y corregir</title><desc id="data-desc">Una capacidad técnica no determina por sí sola el uso político que se hará de ella. Datos: tratamiento, hacia Clasificación. Clasificación: insumo, no mandato, hacia Decisión con efectos. Decisión con efectos: posibilidad de revisión, hacia Explicación y recurso. Explicación y recurso: rectificación, hacia Datos.</desc><style>text{font-family:Arial,sans-serif;fill:#171717}.node-rect{fill:#fff;stroke:#ccc}.node-label{font-size:13px}.node-dot{fill:#24735b}.edge{stroke:#666;fill:none}.edge-label{font-size:10px;fill:#555;paint-order:stroke;stroke:#fafafa;stroke-width:4px;stroke-linejoin:round}</style><rect width="670" height="290" fill="#fafafa"/><defs><marker id="data-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#666"/></marker></defs><path class="edge" d="M 198 65 L 248 65" stroke-width="1" marker-end="url(#data-arrow)"/><text class="edge-label" x="223" y="25" text-anchor="middle">tratamiento</text><path class="edge" d="M 418 65 L 468 65" stroke-width="1" marker-end="url(#data-arrow)"/><text class="edge-label" x="443" y="25" text-anchor="middle">insumo, no mandato</text><path class="edge" d="M 472 65 L 422 235" stroke-width="1" marker-end="url(#data-arrow)"/><text class="edge-label" x="447" y="141" text-anchor="middle">posibilidad de revisión</text><path class="edge" d="M 252 235 L 202 65" stroke-width="1" marker-end="url(#data-arrow)"/><text class="edge-label" x="227" y="141" text-anchor="middle">rectificación</text><g data-node="data" data-description="Qué información se obtiene, con qué finalidad, de quién y durante cuánto tiempo." data-label="Datos" aria-label="Datos"><rect class="node-rect" x="30" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="47" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="123" y="69">Datos</tspan></text></g><g data-node="model" data-description="Un modelo transforma registros en una predicción o categoría; su resultado puede contener errores y no define un derecho." data-label="Clasificación" aria-label="Clasificación"><rect class="node-rect" x="250" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="69">Clasificación</tspan></text></g><g data-node="decision" data-description="Una persona o institución convierte la clasificación en acceso, rechazo, inspección o sanción." data-label="Decisión con efectos" aria-label="Decisión con efectos"><rect class="node-rect" x="470" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="487" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="563" y="61.5">Decisión con</tspan><tspan x="563" y="76.5">efectos</tspan></text></g><g data-node="appeal" data-description="La persona afectada necesita saber qué ocurrió y disponer de una vía efectiva de impugnación." data-label="Explicación y recurso" aria-label="Explicación y recurso"><rect class="node-rect" x="250" y="208" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="235" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="231.5">Explicación y</tspan><tspan x="343" y="246.5">recurso</tspan></text></g></svg>