<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 290" width="670" height="290" role="group" aria-labelledby="liberty-title liberty-desc"><title id="liberty-title">Más de una manera de continuar</title><desc id="liberty-desc">La autonomía necesita opciones que puedan ejercerse, incluso en desacuerdo. Disentir: organización libre, hacia Asociarse. Asociarse: nuevas iniciativas, hacia Competir. Recurrir y corregir: protección, hacia Disentir. Recurrir y corregir: reglas revisables, hacia Competir.</desc><style>text{font-family:Arial,sans-serif;fill:#171717}.node-rect{fill:#fff;stroke:#ccc}.node-label{font-size:13px}.node-dot{fill:#24735b}.edge{stroke:#666;fill:none}.edge-label{font-size:10px;fill:#555;paint-order:stroke;stroke:#fafafa;stroke-width:4px;stroke-linejoin:round}</style><rect width="670" height="290" fill="#fafafa"/><defs><marker id="liberty-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#666"/></marker></defs><path class="edge" d="M 198 65 L 248 65" stroke-width="1" marker-end="url(#liberty-arrow)"/><text class="edge-label" x="223" y="25" text-anchor="middle">organización libre</text><path class="edge" d="M 418 65 L 468 65" stroke-width="1" marker-end="url(#liberty-arrow)"/><text class="edge-label" x="443" y="25" text-anchor="middle">nuevas iniciativas</text><path class="edge" d="M 252 235 L 202 65" stroke-width="1" marker-end="url(#liberty-arrow)"/><text class="edge-label" x="227" y="141" text-anchor="middle">protección</text><path class="edge" d="M 418 235 L 468 65" stroke-width="1" marker-end="url(#liberty-arrow)"/><text class="edge-label" x="443" y="141" text-anchor="middle">reglas revisables</text><g data-node="dissent" data-description="Poder contradecir al gobierno o a un grupo sin perder derechos básicos por esa opinión." data-label="Disentir" aria-label="Disentir"><rect class="node-rect" x="30" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="47" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="123" y="69">Disentir</tspan></text></g><g data-node="associate" data-description="Crear acuerdos voluntarios, sostener proyectos comunes y abandonarlos sin imposiciones arbitrarias." data-label="Asociarse" aria-label="Asociarse"><rect class="node-rect" x="250" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="69">Asociarse</tspan></text></g><g data-node="compete" data-description="Proponer alternativas bajo reglas generales, sin comprar una excepción ni excluir a quienes llegan después." data-label="Competir" aria-label="Competir"><rect class="node-rect" x="470" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="487" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="563" y="69">Competir</tspan></text></g><g data-node="appeal" data-description="Contar con vías de revisión, reparación y cambio pacífico cuando una decisión causa daño." data-label="Recurrir y corregir" aria-label="Recurrir y corregir"><rect class="node-rect" x="250" y="208" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="235" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="231.5">Recurrir y</tspan><tspan x="343" y="246.5">corregir</tspan></text></g></svg>