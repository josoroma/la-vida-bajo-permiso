<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 290" width="670" height="290" role="group" aria-labelledby="rights-title rights-desc"><title id="rights-title">Decidir juntos sin disponer de otros</title><desc id="rights-desc">Una mayoría necesita reglas que también protejan a quienes pierden la votación. Decisión colectiva: sujeción a límites, hacia Derechos y ley general. Derechos y ley general: protección, hacia Disenso y asociación. Disenso y asociación: reclamación, hacia Recurso independiente. Recurso independiente: revisión, hacia Decisión colectiva.</desc><style>text{font-family:Arial,sans-serif;fill:#171717}.node-rect{fill:#fff;stroke:#ccc}.node-label{font-size:13px}.node-dot{fill:#24735b}.edge{stroke:#666;fill:none}.edge-label{font-size:10px;fill:#555;paint-order:stroke;stroke:#fafafa;stroke-width:4px;stroke-linejoin:round}</style><rect width="670" height="290" fill="#fafafa"/><defs><marker id="rights-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#666"/></marker></defs><path class="edge" d="M 198 65 L 248 65" stroke-width="1" marker-end="url(#rights-arrow)"/><text class="edge-label" x="223" y="25" text-anchor="middle">sujeción a límites</text><path class="edge" d="M 418 65 L 468 65" stroke-width="1" marker-end="url(#rights-arrow)"/><text class="edge-label" x="443" y="25" text-anchor="middle">protección</text><path class="edge" d="M 472 65 L 422 235" stroke-width="1" marker-end="url(#rights-arrow)"/><text class="edge-label" x="447" y="141" text-anchor="middle">reclamación</text><path class="edge" d="M 252 235 L 202 65" stroke-width="1" marker-end="url(#rights-arrow)"/><text class="edge-label" x="227" y="141" text-anchor="middle">revisión</text><g data-node="decision" data-description="La decisión común permite resolver asuntos compartidos; su legitimidad también depende de límites y procedimientos." data-label="Decisión colectiva" aria-label="Decisión colectiva"><rect class="node-rect" x="30" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="47" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="123" y="69">Decisión colectiva</tspan></text></g><g data-node="limit" data-description="La igualdad jurídica restringe excepciones concedidas según cercanía, pertenencia o capacidad de presión." data-label="Derechos y ley general" aria-label="Derechos y ley general"><rect class="node-rect" x="250" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="61.5">Derechos y ley</tspan><tspan x="343" y="76.5">general</tspan></text></g><g data-node="dissent" data-description="La libertad incluye organizar una oposición y no adherirse a una organización." data-label="Disenso y asociación" aria-label="Disenso y asociación"><rect class="node-rect" x="470" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="487" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="563" y="61.5">Disenso y</tspan><tspan x="563" y="76.5">asociación</tspan></text></g><g data-node="appeal" data-description="Una garantía necesita una vía practicable para cuestionar una decisión y obtener reparación." data-label="Recurso independiente" aria-label="Recurso independiente"><rect class="node-rect" x="250" y="208" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="235" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="231.5">Recurso</tspan><tspan x="343" y="246.5">independiente</tspan></text></g></svg>