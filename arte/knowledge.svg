<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 290" width="670" height="290" role="group" aria-labelledby="knowledge-title knowledge-desc"><title id="knowledge-title">Conocimiento que nadie reúne por completo</title><desc id="knowledge-desc">Una red puede ajustar decisiones sin compartir una única finalidad. Producción: oferta, hacia Intercambio. Preferencias: demanda, hacia Intercambio. Intercambio: señales y resultados, hacia Aprendizaje. Aprendizaje: revisión de planes, hacia Producción. Aprendizaje: nuevas alternativas, hacia Preferencias.</desc><style>text{font-family:Arial,sans-serif;fill:#171717}.node-rect{fill:#fff;stroke:#ccc}.node-label{font-size:13px}.node-dot{fill:#24735b}.edge{stroke:#666;fill:none}.edge-label{font-size:10px;fill:#555;paint-order:stroke;stroke:#fafafa;stroke-width:4px;stroke-linejoin:round}</style><rect width="670" height="290" fill="#fafafa"/><defs><marker id="knowledge-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#666"/></marker></defs><path class="edge" d="M 198 65 L 248 65" stroke-width="1" marker-end="url(#knowledge-arrow)"/><text class="edge-label" x="223" y="25" text-anchor="middle">oferta</text><path class="edge" d="M 472 65 L 422 65" stroke-width="1" marker-end="url(#knowledge-arrow)"/><text class="edge-label" x="447" y="25" text-anchor="middle">demanda</text><path class="edge" d="M 335 93 L 335 203" stroke-width="1" marker-end="url(#knowledge-arrow)"/><text class="edge-label" x="335" y="139" text-anchor="middle">señales y resultados</text><path class="edge" d="M 252 235 L 202 65" stroke-width="1" marker-end="url(#knowledge-arrow)"/><text class="edge-label" x="227" y="141" text-anchor="middle">revisión de planes</text><path class="edge" d="M 418 235 L 468 65" stroke-width="1" marker-end="url(#knowledge-arrow)"/><text class="edge-label" x="443" y="141" text-anchor="middle">nuevas alternativas</text><g data-node="producer" data-description="Quien produce conoce capacidades, averías, posibilidades y restricciones que cambian en el tiempo." data-label="Producción" aria-label="Producción"><rect class="node-rect" x="30" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="47" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="123" y="69">Producción</tspan></text></g><g data-node="exchange" data-description="Los precios aportan comparaciones monetarias. No registran todos los valores humanos ni garantizan que no existan privilegios." data-label="Intercambio" aria-label="Intercambio"><rect class="node-rect" x="250" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="69">Intercambio</tspan></text></g><g data-node="consumer" data-description="Las decisiones de compra expresan fines diversos bajo restricciones de ingreso e información." data-label="Preferencias" aria-label="Preferencias"><rect class="node-rect" x="470" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="487" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="563" y="69">Preferencias</tspan></text></g><g data-node="learning" data-description="Resultados, errores y nuevas propuestas modifican planes. Importan las posibilidades de entrada, corrección y salida." data-label="Aprendizaje" aria-label="Aprendizaje"><rect class="node-rect" x="250" y="208" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="235" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="239">Aprendizaje</tspan></text></g></svg>