<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 290" width="670" height="290" role="group" aria-labelledby="germany-title germany-desc"><title id="germany-title">La vida pierde sus defensas</title><desc id="germany-desc">La persecución afectó derechos, organizaciones, trabajo y medios de vida. Excepción política: eliminación de autonomía, hacia Organización sometida. Organización sometida: coordinación coercitiva, hacia Exclusión jurídica. Exclusión jurídica: radicalización del proyecto, hacia Guerra y exterminio.</desc><style>text{font-family:Arial,sans-serif;fill:#171717}.node-rect{fill:#fff;stroke:#ccc}.node-label{font-size:13px}.node-dot{fill:#24735b}.edge{stroke:#666;fill:none}.edge-label{font-size:10px;fill:#555;paint-order:stroke;stroke:#fafafa;stroke-width:4px;stroke-linejoin:round}</style><rect width="670" height="290" fill="#fafafa"/><defs><marker id="germany-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#666"/></marker></defs><path class="edge" d="M 198 65 L 248 65" stroke-width="1" marker-end="url(#germany-arrow)"/><text class="edge-label" x="223" y="25" text-anchor="middle">eliminación de autonomía</text><path class="edge" d="M 418 65 L 468 65" stroke-width="1" marker-end="url(#germany-arrow)"/><text class="edge-label" x="443" y="25" text-anchor="middle">coordinación coercitiva</text><path class="edge" d="M 555 93 L 555 203" stroke-width="1" marker-end="url(#germany-arrow)"/><text class="edge-label" x="555" y="139" text-anchor="middle">radicalización del proyecto</text><g data-node="decree" data-description="Decretos y medidas de emergencia suspendieron garantías y facilitaron la persecución de opositores." data-label="Excepción política" aria-label="Excepción política"><rect class="node-rect" x="30" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="47" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="123" y="69">Excepción política</tspan></text></g><g data-node="organization" data-description="El pluralismo político y los sindicatos independientes fueron eliminados; no eran socios libres de negociación." data-label="Organización sometida" aria-label="Organización sometida"><rect class="node-rect" x="250" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="267" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="343" y="61.5">Organización</tspan><tspan x="343" y="76.5">sometida</tspan></text></g><g data-node="exclusion" data-description="La ciudadanía, las profesiones y la propiedad se reorganizaron mediante criterios raciales y políticos." data-label="Exclusión jurídica" aria-label="Exclusión jurídica"><rect class="node-rect" x="470" y="38" width="170" height="54" rx="4"/><circle class="node-dot" cx="487" cy="65" r="3"/><text class="node-label" text-anchor="middle"><tspan x="563" y="69">Exclusión jurídica</tspan></text></g><g data-node="war" data-description="La expansión militar y el genocidio no se explican como una simple consecuencia automática de controles económicos." data-label="Guerra y exterminio" aria-label="Guerra y exterminio"><rect class="node-rect" x="470" y="208" width="170" height="54" rx="4"/><circle class="node-dot" cx="487" cy="235" r="3"/><text class="node-label" text-anchor="middle"><tspan x="563" y="231.5">Guerra y</tspan><tspan x="563" y="246.5">exterminio</tspan></text></g></svg>